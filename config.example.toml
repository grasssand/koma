# ==========================================
# KOMA 工具箱配置文件
# ==========================================

[app]
# 窗口大小（整数，不要加引号）
height = 800
width = 900
# 界面字体
font = "Noto Sans SC"
# 日志字体
monospace_font = "Maple Mono NF CN"
# 界面字体大小（整数）
font_size = 9
# 文件列表字体大小（整数）
list_font_size = 10
# 是否保存本地日志文件（路径: <配置目录>/logs/koma.log）
enable_file_log = true

[converter]
# 线程并发数
# 设置为 0 则自动使用 CPU 核心数的 75%
max_workers = 0
# 转换格式，可选: "avif (svt)", "avif (aom)", "webp", "jxl"
format = "avif (svt)"
# 质量 (1-100)
quality = 75
# 无损模式
lossless = false

[deduplicator]
# 查重文件夹/文件名解析正则（必须包含 artist / title 命名分组，series 可选）
comic_dir_regex = '''(\((?P<event>[^([]+)\))?\s*(\[(?P<artist>[^]]+)\])?\s*(?P<title>[^([]+)\s*(\((?P<series>[^[]+))?\s*(\[(?P<language>[^]]+)\])?\s*(?P<tail>.*)?'''

[extensions]
# 需要转换的格式
convert = [
    ".jpg", ".jpeg", ".png", ".bmp", ".gif", ".tif", ".tiff"
]
# 直接复制的格式
passthrough = [
    ".avif", ".webp", ".jxl", ".heic"
]
# 归档文件格式
archive = [
    ".zip", ".cbz", ".rar", ".cbr", ".7z", ".cb7", ".tar",
    ".gz", ".tgz", ".bz2", ".tbz2", ".xz", ".txz", ".zst"
]
# 文档格式
document = [
    ".pdf", ".epub", ".azw3", ".mobi"
]

# 杂项文件白名单
misc_whitelist = [
    "comicinfo.xml", "readme.txt", "readme.md"
]
# 系统垃圾文件
system_junk = [
    ".ds_store", "thumbs.db", "__macosx", "desktop.ini"
]

[scanner]
# 是否开启广告扫描
enable_ad_scan = false
# 是否开启自定义广告图扫描
enable_custom_ad_scan = false
# 是否开启压缩包扫描
enable_archive_scan = false
# 二维码白名单 (匹配二维码 URL 的 host 域名，含其子域；不含这些的视为广告)
